<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4D Model</title>
    <style>
      html, body, #container {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f5f5;
      }
      #status {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 10;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #e5e7eb;
        font: 13px/1.4 Segoe UI, Arial, sans-serif;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading model…</div>
    <div id="container"></div>
    <script type="module" src="/src/viewer.js"></script>
  </body>
</html>
